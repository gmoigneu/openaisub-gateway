# Put agents on this network; use compose.host.yaml for host testing.
services:
  gateway:
    build: .
    image: openaisub-gateway:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    expose:
      - "8080"
    environment:
      GATEWAY_DATA_DIR: /data
      GATEWAY_API_ADDR: :8080
      GATEWAY_ADMIN_ADDR: :8081
      GATEWAY_ADMIN_SECRET_FILE: /run/secrets/admin_secret
      GATEWAY_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    volumes:
      - gateway-data:/data
    secrets:
      - admin_secret
      - encryption_key
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  gateway-data:

secrets:
  admin_secret:
    file: ./secrets/admin_secret
  encryption_key:
    file: ./secrets/encryption_key
